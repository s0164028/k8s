apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: apn-ingress
  namespace: apn-stack
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"  
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-buffer-size: "64k"  

spec:
  ingressClassName: nginx
  tls:
  - hosts:
      - apn.local
      - rvanaken.duckdns.org
    # cert-manager creates and manages this secret
    secretName: apn-tls

  rules:
  - host: apn.local
    http:
      paths:
      - path: /api(/|$)(.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: node
            port:
              number: 3000
      - path: /
        pathType: Prefix
        backend:
          service:
            name: lighttpd
            port:
              number: 80

  - host: rvanaken.duckdns.org
    http:
      paths:              
      - path: /api(/|$)(.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: node
            port:
              number: 3000

      - path: /
        pathType: Prefix
        backend:
          service:
            name: lighttpd
            port:
              number: 80


---

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: argocd-server-ingress
  namespace: argocd
  annotations:
    # Tell cert-manager which issuer to use
    cert-manager.io/cluster-issuer: clusterissuer-selfsigned
    # Nginx-specific annotations
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-buffer-size: "64k"    
    nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"
spec:
  ingressClassName: nginx
  rules:
    - host: argocd.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: argocd-server
                port:
                  number: 443
  tls:
  - hosts:
      - argocd.local
    # cert-manager creates and manages this secret
    secretName: argocd-server-tls   