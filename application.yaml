apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: apn-stack
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/s0164028/k8s.git
    targetRevision: HEAD
    path: apn-stack
  destination:
    server: https://kubernetes.default.svc
    namespace: apn-stack

  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      prune: true
      selfHeal: true