apiVersion: v1
kind: ConfigMap
metadata:
  name: lighttpd-config
  namespace: apn-stack
data:
  index.html: |
    <!DOCTYPE html>
    <html lang="en">
    <head>
    <meta charset="UTF-8">
    <title>How Docker, Debian & Lighttpd Work Together</title>
    <style>
      body { font-family: Arial, sans-serif; margin: 40px; line-height: 1.6; }
      h1, h2 { color: #333; }
      code { background: #eee; padding: 2px 4px; border-radius: 4px; }
      .section { margin-bottom: 40px; }
    </style>
    </head>
    <body>
      <h2>Congratulations, <span id="user">Loading...</span>!</h2>
        <div class="section">
        <h2>User has reached milestone 2!</h2>
      </div>
        <div class="section">
      <h2>User Information via <code>/api/user</code></h2>
      <p>
        The name shown above is not hard‑coded into the HTML. It is fetched dynamically
        from the Kubernetes cluster using the backend API endpoint <code>/api/user</code>.
        This call demonstrates how the different components of the APN stack work together.
      </p>

      <ul>
        <li>
          <strong>Browser JavaScript</strong> sends a request to <code>/api/user</code>
          as soon as the page loads.
        </li>

        <li>
          <strong>Kubernetes Ingress</strong> receives the request and routes it to the
          Node.js backend. The Ingress also rewrites the path so Node.js receives a clean
          <code>/user</code> request.
        </li>

        <li>
          <strong>Node.js</strong> handles the request inside its own pod. It queries
          MongoDB to retrieve the stored user record.
        </li>

        <li>
          <strong>MongoDB</strong> returns the user document (for example,
          <code>{ name: "Roeland" }</code>) from the database.
        </li>

        <li>
          <strong>Node.js</strong> responds with JSON containing the user’s name.
        </li>

        <li>
          The browser receives the JSON and updates the
          <code>&lt;span id="user"&gt;</code> element in the heading, replacing
          <em>Loading...</em> with the actual user name.
        </li>
      </ul>

      <p>
        This round‑trip demonstrates how Kubernetes orchestrates multiple services:
        the frontend served by Lighttpd, the backend running in Node.js pods,
        the database stored in MongoDB, and the Ingress routing everything together
        under a single hostname <code>apn.local</code>.
      </p>
    </div>
      <div class="section">
        <h2>1. Docker & Containers</h2>
        <p>Docker packages applications into containers. Each container is isolated and contains everything needed to run the application.</p>
        <p>In this Kubernetes setup, Docker is used to build the container images that Minikube runs:</p>
        <ul>
          <li><strong>Debian</strong> – the base operating system inside the Lighttpd and Node.js containers</li>
          <li><strong>Lighttpd</strong> – serves the static HTML frontend</li>
          <li><strong>Node.js</strong> – provides the backend API and connects to MongoDB</li>
          <li><strong>MongoDB</strong> – stores user data inside a dedicated database pod</li>
        </ul>
        <p>These containers become the building blocks that Kubernetes orchestrates.</p>
      </div>

      <div class="section">
        <h2>2. Minikube</h2>
        <p>Minikube is a lightweight Kubernetes cluster that runs locally on your machine. It provides a full Kubernetes environment including:</p>
        <ul>
          <li><strong>API Server</strong> – the central control plane that manages all Kubernetes objects</li>
          <li><strong>Scheduler</strong> – decides which node runs each pod</li>
          <li><strong>Kubelet</strong> – runs and monitors containers inside pods</li>
          <li><strong>Container Runtime</strong> – executes Docker images inside the cluster</li>
        </ul>
        <p>Minikube also exposes a LoadBalancer IP (mapped to <code>127.0.0.1</code>) so your browser can reach the Kubernetes Ingress.</p>
      </div>

      <div class="section">
        <h2>3. Kubernetes Deployments, Pods & Services</h2>
        <p>Kubernetes uses several core components to keep your application running:</p>
        <ul>
          <li><strong>Deployments</strong> – define how many replicas of each component should run (e.g., scaling Node.js pods)</li>
          <li><strong>Pods</strong> – the smallest deployable units; each pod runs one container</li>
          <li><strong>Services</strong> – stable network endpoints that expose pods inside the cluster</li>
        </ul>
        <p>For example, the Node.js Deployment may run multiple pods, and the Node.js Service load‑balances traffic between them.</p>
      </div>

      <div class="section">
        <h2>4. Lighttpd (Frontend)</h2>
        <p>Lighttpd is a lightweight, high‑performance web server designed for speed and low memory usage.</p>
        <p>In this Kubernetes setup, Lighttpd:</p>
        <ul>
          <li>Serves static HTML, CSS, and JavaScript files</li>
          <li>Runs inside its own pod managed by a Deployment</li>
          <li>Is exposed through a Kubernetes Service</li>
          <li>Is reached through the Ingress when users visit <code>http://apn.local</code></li>
        </ul>
        <p>Lighttpd no longer proxies API requests — Kubernetes Ingress handles all routing.</p>
      </div>

      <div class="section">
        <h2>5. Node.js (Backend API)</h2>
        <p>The Node.js application provides the backend API for this project. It runs inside its own pod and is exposed through a Kubernetes Service.</p>
        <p>Node.js handles:</p>
        <ul>
          <li><strong>/api/info</strong> – returns container ID, platform, and architecture</li>
          <li><strong>/api/user</strong> – fetches user data from MongoDB</li>
          <li>Automatic scaling via Kubernetes Deployments</li>
        </ul>
        <p>When scaled to multiple replicas, the Ingress load‑balances requests across all Node.js pods.</p>
      </div>

      <div class="section">
        <h2>6. MongoDB (Database)</h2>
        <p>MongoDB stores persistent user data. It runs inside its own pod and is accessed only by the Node.js backend.</p>
        <p>In Kubernetes:</p>
        <ul>
          <li>MongoDB runs in a dedicated Deployment</li>
          <li>A Service exposes MongoDB internally to Node.js</li>
          <li>PersistentVolumeClaims ensure data survives pod restarts</li>
        </ul>
      </div>

      <div class="section">
        <h2>7. Kubernetes Ingress</h2>
        <p>The Ingress is the gateway that routes external traffic into the cluster. It is responsible for:</p>
        <ul>
          <li>Routing <strong>/</strong> to the Lighttpd Service</li>
          <li>Routing <strong>/api/*</strong> to the Node.js Service</li>
          <li>Rewriting paths so Node.js receives clean URLs (e.g., <code>/api/info → /info</code>)</li>
          <li>Load‑balancing across multiple Node.js pods</li>
        </ul>
        <p>The Ingress is what makes the entire multi‑service architecture accessible through a single hostname: <code>apn.local</code>.</p>
      </div>

      <div class="section">
        <h2>8. How Everything Works Together</h2>
        <p>This project demonstrates a complete microservice architecture running inside Kubernetes:</p>
        <ul>
          <li><strong>Browser → Ingress</strong> – user traffic enters the cluster</li>
          <li><strong>Ingress → Lighttpd</strong> – serves the frontend</li>
          <li><strong>Ingress → Node.js</strong> – handles API requests</li>
          <li><strong>Node.js → MongoDB</strong> – retrieves stored data</li>
          <li><strong>Kubernetes</strong> – orchestrates all components, scales them, and keeps them healthy</li>
        </ul>
        <p>This architecture is identical to what modern cloud platforms use in production environments.</p>
      </div>


      <div class="section">
        <h2>6. Your Backend: /server-info</h2>
        <p>If your container exposes an API endpoint at <code>/info</code>, this page fetches that information and displays it below.</p>

        <div id="server-info" style="padding:10px; background:#f0f0f0; border-radius:6px;">
          Loading server info...
        </div>
          <script>
              async function init() {
                const el = document.getElementById('server-info');
                const userEl = document.getElementById('user');

                    try {
                      const res = await fetch('/api/info');
                      const data = await res.json();

                    el.innerHTML = `
                      <strong>Container ID:</strong> ${data.container_id}<br>
                      <strong>Platform:</strong> ${data.platform}<br>
                      <strong>Architecture:</strong> ${data.architecture}
                    `;
                  } catch {
                    el.textContent = 'Error fetching server info';
                  }
                

                try {
                  // Fetch user info
                  const userRes = await fetch('/api/user');
                  if (!userRes.ok) throw new Error('User request failed');
                  const userData = await userRes.json();
                  userEl.innerText = userData.name;
                } catch (err) {
                  userEl.innerText = "Unknown user";
                }
              }

              init();
          </script>
        
      </div>

    </body>
    </html>

  99_custom.conf: |
    server.modules += ( "mod_proxy", "mod_rewrite" )

    $HTTP["url"] =~ "^/api/info" {
        proxy.server = (
            "" => (
                "node" => (
                    "host" => "node",
                    "port" => 3000
                )
            )
        )
    }

    $HTTP["url"] =~ "^/api/user" {
        proxy.server = (
            "" => (
                "node" => (
                    "host" => "node",
                    "port" => 3000
                )
            )
        )
    }