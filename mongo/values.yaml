image:
  repository: roelandvanaken/k8s-mongo
  tag: "1.0"
  pullPolicy: IfNotPresent

replicaCount: 1

storage:
  size: 1Gi

service:
  port: 27017
  type: ClusterIP

mongo:
  secretName: mongo-creds
  usernameKey: username
  passwordKey: password
  databaseKey: database

seed:
  script: |
    db = db.getSiblingDB('db');
    db.createCollection('users');
    db.users.insertMany([
      { name: "Roeland", email: "roeland@example.com" }
    ]);

credentials:
  username: admin
  password: admin123
  database: db
